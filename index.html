    <script>
      // Runtime constraint: HMR is disabled in AI Studio. Ignore WebSocket & Vite HMR errors.
      (function() {
        var origConsoleError = console.error;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          var msg = args.map(function(a) {
            return (a && a.message) ? a.message : String(a);
          }).join(' ');
          if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('@vite/client') !== -1 || msg.indexOf('[vite]') !== -1) {
            return;
          }
          return origConsoleError.apply(console, args);
        };
        window.addEventListener('error', function(e) {
          var msg = (e && e.message) ? e.message : '';
          if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('@vite/client') !== -1 || msg.indexOf('[vite]') !== -1) {
            e.preventDefault();
            e.stopPropagation();
            return true;
          }
        }, true);
        window.addEventListener('unhandledrejection', function(e) {
          var reason = (e && e.reason) ? ((e.reason.message) || String(e.reason)) : '';
          if (reason.indexOf('WebSocket') !== -1 || reason.indexOf('@vite/client') !== -1 || reason.indexOf('[vite]') !== -1) {
            e.preventDefault();
            e.stopPropagation();
          }
        }, true);
      })();
    </script>
